<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>少女迴戰 單機抽卡 MVP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="side-nav" aria-label="主功能">
        <div class="brand">
          <span class="brand-mark">召</span>
          <div>
            <strong>單機版</strong>
            <small>喚靈測試</small>
          </div>
        </div>
        <button class="nav-button active" data-view="home" type="button">主界面</button>
        <button class="nav-button" data-view="gacha" type="button">抽卡</button>
        <button class="nav-button" data-view="gallery" type="button">圖鑑</button>
        <button class="nav-button" data-view="history" type="button">記錄</button>
      </aside>

      <section class="content">
        <header class="top-bar">
          <div>
            <div class="eyebrow">Local Save</div>
            <h1 id="view-title">主界面</h1>
          </div>
          <div class="wallet">
            <span>喚靈券 <strong id="ticket-count">0</strong></span>
            <span>源石 <strong id="gem-count">0</strong></span>
          </div>
        </header>

        <section id="home" class="view active">
          <div class="hero-stage">
            <div class="hero-copy">
              <span class="pill">看板娘</span>
              <h2 id="home-hero-name">莉莉絲</h2>
              <p id="home-hero-meta">SSR / hero_003</p>
              <div class="hero-actions">
                <button class="primary" data-action="open-gacha" type="button">前往喚靈</button>
                <button class="secondary" data-action="open-gallery" type="button">查看圖鑑</button>
              </div>
            </div>
            <img id="home-hero-art" class="hero-art" alt="角色資源預覽" />
          </div>
          <div class="status-grid">
            <article>
              <span>已收集</span>
              <strong id="owned-count">0</strong>
            </article>
            <article>
              <span>高級保底</span>
              <strong id="pity-count">0/60</strong>
            </article>
            <article>
              <span>最近結果</span>
              <strong id="last-result">無</strong>
            </article>
          </div>
        </section>

        <section id="gacha" class="view">
          <div class="pool-tabs" id="pool-tabs"></div>
          <div class="gacha-layout">
            <div class="pool-panel">
              <div class="pool-head">
                <div>
                  <span class="pill" id="pool-type">高級喚靈</span>
                  <h2 id="pool-name">高級喚靈</h2>
                </div>
                <div class="rate-box">
                  <span>SSR</span>
                  <strong>2%</strong>
                </div>
              </div>
              <p id="pool-heroes" class="pool-heroes"></p>
              <div class="draw-actions">
                <button class="primary" data-draw="1" type="button">喚靈 1 次</button>
                <button class="primary" data-draw="10" type="button">喚靈 10 次</button>
              </div>
            </div>
            <div class="result-panel">
              <h3>本次結果</h3>
              <div id="draw-results" class="draw-results"></div>
            </div>
          </div>
        </section>

        <section id="gallery" class="view">
          <div class="gallery-layout">
            <div id="gallery-grid" class="gallery-grid"></div>
            <aside class="detail-panel">
              <img id="detail-art" class="detail-art" alt="角色展示" />
              <div>
                <span class="pill" id="detail-rarity">SSR</span>
                <h2 id="detail-name">莉莉絲</h2>
                <p id="detail-assets">hero_003 / bhero_003 / zhero_003</p>
              </div>
              <button class="secondary" data-action="set-home" type="button">設為看板</button>
            </aside>
          </div>
        </section>

        <section id="history" class="view">
          <div class="history-list" id="history-list"></div>
          <button class="danger" data-action="reset-save" type="button">重置本地存檔</button>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
